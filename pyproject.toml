[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sim-lab"
version = "0.1.0"
description = "A resource-efficient, data-centered cybersecurity laboratory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3",
    "PyYAML>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/simlab"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
